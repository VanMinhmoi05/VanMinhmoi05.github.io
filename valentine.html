<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine</title>
    <style>
        body {
            background-color: #ffcccc;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Parisienne', cursive;
            overflow: hidden;
        }
        h1 {
            font-size: 4vw;
            color: #d64f4f;
            font-family: 'Great Vibes', cursive;
        }
        .message {
            font-size: 2vw;
            color: #b22222;
            font-family: 'Dancing Script', cursive;
        }
        .heart-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
        }
        .heart-container img {
            width: 10vw;
            height: auto;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .heart-container img:hover {
            transform: scale(1.2) rotate(12deg);
        }
        .falling-heart {
            position: absolute;
            width: 8vw;
            height: auto;
            animation: falling 6s linear infinite;
        }
        @keyframes falling {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 8vw;
            }
            .message {
                font-size: 4vw;
            }
            .heart-container img {
                width: 12vw;
            }
            .falling-heart {
                width: 10vw;
            }
        }
    </style>
</head>
<body>
    <h1>Happy Valentine, My Love! ❤️</h1>
    <p class="message">Gửi em bé yêu của anh, cảm ơn em đã ở bên anh 108 ngày, mong rằng sau này vẫn có em bên cạnh! Yêu em nhiều ❤️</p>
    <div class="heart-container" id="heart-container"></div>
    <script>
        const heartContainer = document.getElementById('heart-container');
        let heartImages = ['anh1.jpg', 'anh2.jpg', 'anh3.jpg', 'anh4.jpg', 'anh5.jpg'];
        function updateHeart() {
            heartContainer.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                let img = document.createElement('img');
                img.src = heartImages[i % heartImages.length];
                heartContainer.appendChild(img);
            }
        }
        updateHeart();
    </script>
</body>
</html>
